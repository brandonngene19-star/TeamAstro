<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternFlow Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script src="indexdb.js"></script>
</head>
<body>
    
    <main class="login-shell">


        
        <section class="login-panel" aria-label="Admin login">
            <div class="glow-circle top"></div>
            <div class="glow-circle middle"></div>
            <div class="glow-circle bottom"></div>
            <div class="login-panel-content">
                <div class="login-heading">
                    <span><i class="fas fa-lock"></i></span>
                    <div>
                        <h2>Admin Login</h2>
                        <p>Please enter your credentials to continue</p>
                        <i></i>
                    </div>
                </div>

                
                <form class="login-card" id="loginForm" novalidate>
                    <label class="login-field" for="loginEmail">
                        <span>Email Address</span>
                        <div class="input-wrap">
                            <i class="far fa-envelope"></i>
                            <input id="loginEmail" name="email" type="email" placeholder="admin@company.com" autocomplete="email" required>
                        </div>
                    </label>

                    <label class="login-field" for="loginPassword">
                        <span>Password</span>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button class="password-toggle" type="button" id="togglePassword" aria-label="Show password">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </label>

                    <p class="login-error" id="loginError" role="alert"></p>

                    <button class="signin-button" type="submit">
                        <i class="fas fa-right-to-bracket"></i>
                        <span>Sign In</span>
                    </button>

                    <div class="login-divider">
                        
                    </div>
                </form>

                <footer class="login-footer">
                    <div>
                        <p><strong>Secure Login</strong><br>Your data is safe with us.</p>
                    </div>
                    <p>&copy; 2025 InternFlow.<br>All rights reserved.</p>
                </footer>
            </div>
        </section>
    </main>
</body>
</html>
